<table width="100%">
    <thead align="left">
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Tier</th>
            <th>Verified</th>
            <th>Registered</th>
        </tr>
    </thead>
    {{#each users}}
        <tr>
            <td>{{id}}</td>
            <td>{{email}}</td>
            <td>{{tier}}</td>
            <td>{{verified}}</td>
            <td>{{created_at}}</td>
        </tr>
    {{/each}}
</table>
