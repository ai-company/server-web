<table width="100%">
    <thead align="left">
        <tr>
            <th>ID</th>
            <th>Reported at</th>
            <th>Email</th>
            <th>Comment</th>
        </tr>
    </thead>

    {{#each feedback}}
        <tr>
            <td>{{id}}</td>
            <td>{{created_at}}</td>
            <td>{{email}}</td>
            <td>
                <a href="javascript:modal('feedback-modal-{{@index}}')">Open</a>
                <div id="feedback-modal-{{@index}}" class="modal">
                    <a class="modal-close" onclick="modal('feedback-modal-{{@index}}')"></a>
                    <div class="modal-content panel">
                        <a class="modal-x" onclick="modal('feedback-modal-{{@index}}')">
                            <svg class="icon">
                                <use href="/static/icons/teenyicons/outline.svg#outline--x"></use>
                            </svg>
                        </a>
                        <div style="max-width: 120ch; word-wrap: break-word; white-space: pre-wrap;">{{comment}}</div>
                    </div>
                </div>
            </td>
        </tr>
    {{/each}}
</table>
