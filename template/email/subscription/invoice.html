{{#> email/base}}
    {{#*inline "title"}}
        <a href="{{url "/"}}">Orto</a> invoice
    {{/inline}}

    {{#*inline "body"}}
        <p>
            You have subscribed to the <b>{{tier}}</b> tier.
        </p>
        <p>
            You will be charged <b>{{price}}DKK</b> for this month's use.
        </p>
        <p>
            You can cancel the subscription any time from your <a href="{{url "/user/account"}}">account page</a>.
        </p>
    {{/inline}}
{{/email/base}}
