{{#> email/base}}
    {{#*inline "title"}}
        <a href="{{get_url "/"}}">Orto</a> faktura
    {{/inline}}

    {{#*inline "body"}}
        <p>
            Du er abonneret på <b>{{tier}}</b>-pakken.
        </p>
        <p>
            Der vil blive opkrævet <b>{{price}}DKK</b> for denne måned.
        </p>
        <p>
            Du kan opsige dit abonnement når som helst på <a href="{{get_url "/user/account"}}">konto-siden</a>.
        </p>
    {{/inline}}
{{/email/base}}
