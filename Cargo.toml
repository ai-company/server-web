[package]
name = "server"
version = "0.10.0-beta"
authors = ["nilq <i.am.niels.nielsen@gmail.com>"]
edition = "2018"


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3


[dependencies]

# async runtime
# tokio = { version = "=1.5.0", features = ["macros", "rt-multi-thread", "signal"] }

# allocator
jemallocator = "=0.3.2"

# serialization
serde = "=1.0.125"

# utils
rand = "=0.8.3"
regex = "=1.4.5"
time = "=0.2.26"
# uuid generator
nanoid = "=0.1.3"
# mime guesser
tree_magic = "=0.2.3"

# cryptography
# must replace with sha-2 crate
rust-crypto = "0.2.36"

# email
lettre = "=0.9.5"
lettre_email = "=0.9.4"

# web components
actix-web = "=3.3.2"
actix-files = "=0.5.0"
handlebars = { version = "=3.5.5", features = ["dir_source"] }

# datetime
chrono = "=0.4.19"
