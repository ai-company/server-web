[package]
name = "server"
edition = "2021"
version = "0.12.0"
authors = [
    "nilq <i.am.niels.nielsen@gmail.com>",
    "s185023 <s185023@student.dtu.dk>",
    "evolbug <evolhive@gmail.com>",
]


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3


[dependencies]

# runtime
# tokio = { version = "=1.5.0", features = ["macros", "rt-multi-thread", "signal"] }
futures = "=0.3.15"
lazy_static = "=1.4.0"

# allocator
jemallocator = "=0.3.2"

# serialization
serde = { version = "=1.0.130", features = ["derive"] }
serde_json = "=1.0.68"
serde_qs = "=0.8.2"
serde_urlencoded = "=0.7.0"
bincode = "=1.3.3"
rmp-serde = "=0.15.5"

# utils
rand = "=0.8.3"
regex = "=1.5.4"
hex = "=0.4.3"
time = "=0.2.26"
nanoid = "=0.1.3" # uuid generator
url = "=2.2.2" # url parser
strum = { version = "=0.21.0", features = ["derive"] } # enum-string helper
const_format = "=0.2.19"

# cryptography
bcrypt = "=0.9.0" # password hashing
hmac = "=0.10.1"
sha2 = "=0.9.3"

# email
lettre = "=0.9.5"
lettre_email = "=0.9.4"
css-inline = "=0.7.5"

# web components
actix-web = { version="=3.3.2", features = ["rustls"] }
actix-files = "=0.5.0"
actix-multipart = "=0.3.0"
handlebars = { version = "=3.5.5", features = ["dir_source"] }

# datetime
chrono = "=0.4.19"

# database
rusqlite = { version = "=0.25.3", features = ["bundled"] }
r2d2 = "=0.8.9"
r2d2_sqlite = "=0.18.0"
