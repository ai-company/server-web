[package]
name = "alpha"
version = "0.1.0"
authors = ["nilq <i.am.niels.nielsen@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# async runtime
tokio = { version = "^1", features = ["full"] }

# utils
rand = "^0.8"
regex = "^1"
time = "^0.2"
# uuid generator
nanoid = "0.1.3"
# mime guesser
tree_magic = "^0.2"

# cryptography
# must replace with sha-2 crate
rust-crypto = "0.2.36"

# email
lettre = "0.9.2"
lettre_email = "0.9.2"

# web components
hyper = { version = "^0.14", features = ["full"] }
urldecode = "^0.1"
cookie = { version="^0.14", features = ["percent-encode"] }
mime = "^0.3"
uriparse = "^0.6"

# datetime
chrono = "^0.4"
