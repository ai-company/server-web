[package]
name = "server"
edition = "2018"
version = "0.12.0"
authors = [
    "nilq <i.am.niels.nielsen@gmail.com>",
    "s185023 <s185023@student.dtu.dk>",
    "evolbug <evolhive@gmail.com>",
]


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3


[dependencies]

# runtime
# tokio = { version = "=1.5.0", features = ["macros", "rt-multi-thread", "signal"] }
futures = "=0.3.15"
lazy_static = "=1.4.0"

# allocator
jemallocator = "=0.3.2"

# serialization
serde = { version = "=1.0.125", features = ["derive"] }
serde_json = "=1.0.61"
serde_qs = "=0.8.2"

# utils
rand = "=0.8.3"
regex = "=1.4.5"
hex = "=0.4.3"
time = "=0.2.26"
# uuid generator
nanoid = "=0.1.3"
# mime guesser
tree_magic = "=0.2.3"

# cryptography
# must replace with sha-2 crate
rust-crypto = "0.2.36"
base64 = "=0.13.0"
bcrypt = "=0.9.0"
ring = { version = "=0.16.20" }
hmac = "=0.10.1"
sha2 = "=0.9.3"

# email
lettre = "=0.9.5"
lettre_email = "=0.9.4"

# web components
actix-web = { version="=3.3.2", features = ["rustls"] }
actix-files = "=0.5.0"
handlebars = { version = "=3.5.5", features = ["dir_source"] }

# datetime
chrono = "=0.4.19"

# database
rusqlite = { version = "=0.24.2", features = ["bundled"] }
r2d2 = "=0.8.9"
r2d2_sqlite = "=0.17.0"
